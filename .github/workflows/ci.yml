name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Rejeitar artefatos vazios anormais na raiz
        shell: pwsh
        run: |
          $unexpected = @(Get-ChildItem -LiteralPath . -File -Force | Where-Object {
            $_.Length -eq 0 -and $_.Name -match '^[^\p{L}\p{N}._-]+$'
          })
          if ($unexpected.Count -gt 0) {
            $names = $unexpected | ForEach-Object Name
            throw "Arquivos vazios com nomes anormais na raiz: $($names -join ', ')"
          }

      - name: Configurar Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Testar resolução do npm vinculado ao Node
        shell: pwsh
        run: .\scripts\tests\npm-resolution.tests.ps1

      - name: Testar encoding de processos nativos
        shell: pwsh
        run: .\scripts\tests\native-process-encoding.tests.ps1

      - name: Instalar dependências do lockfile
        run: npm ci --include=dev

      - name: Verificar formatação
        run: npm run format:check

      - name: Executar lint
        run: npm run lint

      - name: Executar typecheck
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Compilar frontend
        run: npm run build

      - name: Verificar isolamento do cache PWA
        run: npm run verify:pwa

      - name: Auditar dependências npm
        shell: pwsh
        run: .\scripts\diagnostics\npm-audit.ps1

      - name: Inventariar licenças npm
        shell: pwsh
        run: |
          $sbomPath = Join-Path $env:RUNNER_TEMP 'offline-dental-npm-sbom.json'
          cmd.exe /d /c "npm sbom --sbom-format cyclonedx --include=dev > `"$sbomPath`""
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar o inventário npm.' }
          $components = @((Get-Content -Raw $sbomPath | ConvertFrom-Json).components)
          $missing = @($components | Where-Object { -not $_.licenses -or $_.licenses.Count -eq 0 })
          if ($missing.Count -gt 0) {
            $names = $missing | ForEach-Object { "$($_.name)@$($_.version)" }
            throw "Dependências npm sem licença declarada: $($names -join ', ')"
          }
          $components | Sort-Object name | Select-Object name, version, licenses

  rust:
    name: Servidor Rust/Windows
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validar scripts PowerShell do Windows
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts, installer -Recurse -File |
            Where-Object { $_.Extension -in '.ps1', '.psm1' } |
            ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += @($parseErrors)
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Há scripts PowerShell com erros de sintaxe.'
          }

      - name: Analisar segurança dos scripts PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          Install-Module `
            PSScriptAnalyzer `
            -RequiredVersion 1.24.0 `
            -Scope CurrentUser `
            -Force

          $analysisPaths = @(
            'scripts'
            'installer'
          )

          $issues = @(
            foreach ($analysisPath in $analysisPaths) {
              Invoke-ScriptAnalyzer `
                -Path $analysisPath `
                -Recurse `
                -Settings '.\PSScriptAnalyzerSettings.psd1' `
                -ErrorAction Stop
            }
          )

          if ($issues.Count -gt 0) {
            $issues |
              Sort-Object ScriptName, Line, RuleName |
              Format-Table `
                RuleName,
                Severity,
                ScriptName,
                Line,
                Message `
                -AutoSize

            throw "PSScriptAnalyzer encontrou $($issues.Count) ocorrência(s)."
          }

          Write-Host 'SUCESSO: PSScriptAnalyzer aprovado.' -ForegroundColor Green

      - name: Instalar toolchain fixada
        shell: pwsh
        run: |
          $match = Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$'
          if (-not $match) { throw 'Canal ausente em rust-toolchain.toml.' }
          $channel = $match.Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc
          rustup show active-toolchain

      - name: Testar ambiente MSVC idempotente
        shell: pwsh
        run: .\scripts\tests\msvc-environment.tests.ps1

      - name: Testar variáveis reservadas PowerShell
        shell: pwsh
        run: .\scripts\tests\powershell-reserved-variable.tests.ps1

      - name: Configurar Node.js para assets incorporados
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Testar resolução e bootstrap local do WiX
        shell: pwsh
        run: .\scripts\tests\wix-resolution.tests.ps1

      - name: Testar diagnósticos de processos WiX
        shell: pwsh
        run: .\scripts\tests\wix-process-error.tests.ps1

      - name: Compilar SPA para incorporação no binário
        run: |
          npm ci --include=dev
          npm run build

      - name: Verificar lockfile Cargo
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/Cargo.lock)) {
            throw 'src-tauri/Cargo.lock deve ser versionado para builds determinísticos.'
          }

      - name: Testar ciclo do serviço Windows
        shell: pwsh
        run: .\scripts\tests\windows-service.tests.ps1

      - name: Testar configuração do instalador do serviço
        shell: pwsh
        run: .\scripts\tests\configure-service.tests.ps1

      - name: Testar validação do PID de desenvolvimento
        shell: pwsh
        run: .\scripts\tests\development-host-pid.tests.ps1

      - name: Verificar formatação Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Executar Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Executar testes Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features

      - name: Compilar servidor Rust com a SPA incorporada
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --all-features

      - name: Validar startup diagnostics
        shell: pwsh
        run: |
          $executable = Resolve-Path '.\src-tauri\target\debug\offline-dental-system.exe'
          $diagnostics = & $executable --startup-diagnostics --json
          if ($LASTEXITCODE -ne 0) { throw 'Startup diagnostics falhou.' }
          $parsed = $diagnostics | ConvertFrom-Json
          if ($parsed.formatVersion -ne 2) { throw 'Formato inesperado do startup diagnostics.' }

      - name: Console smoke
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('ods-console-' + [guid]::NewGuid().ToString('N'))
          $data = Join-Path $root 'Data'
          $stdout = Join-Path $root 'stdout.log'
          $stderr = Join-Path $root 'stderr.log'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = (Resolve-Path '.\src-tauri\target\debug\offline-dental-system.exe')
          $info.UseShellExecute = $false
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          [void]$info.ArgumentList.Add('--console')
          [void]$info.ArgumentList.Add('--data-directory')
          [void]$info.ArgumentList.Add($data)
          $process = [Diagnostics.Process]::new()
          $process.StartInfo = $info
          if (-not $process.Start()) { throw 'Não foi possível iniciar o console host.' }
          $outputTask = $process.StandardOutput.ReadToEndAsync()
          $errorTask = $process.StandardError.ReadToEndAsync()
          $response = $null
          $payload = $null
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:8742/api/v1/health' -TimeoutSec 2
                $payload = $response.Content | ConvertFrom-Json
                if ($response.StatusCode -eq 200 -and
                    $response.Headers['Content-Type'] -like 'application/json*' -and
                    $response.Headers['Cache-Control'] -match 'no-store' -and
                    $payload.status -eq 'ok') { break }
              } catch {}
              Start-Sleep -Milliseconds 500
            } while ([DateTime]::UtcNow -lt $deadline -and -not $process.HasExited)
            if ($process.HasExited -or -not $response -or $payload.status -ne 'ok') {
              throw 'O console host não respondeu ao health esperado.'
            }
          } finally {
            if (-not $process.HasExited) { $process.Kill() }
            $process.WaitForExit()
            [IO.File]::WriteAllText($stdout, $outputTask.GetAwaiter().GetResult())
            [IO.File]::WriteAllText($stderr, $errorTask.GetAwaiter().GetResult())
            $process.Dispose()
          }

      - name: Validar MSI sem publicar
        shell: pwsh
        run: |
          $before = git status --short
          cargo build --manifest-path src-tauri/Cargo.toml --locked --all-features --release
          $executable = Resolve-Path '.\src-tauri\target\release\offline-dental-system.exe'
          $securityDiagnostics = & $executable --security-diagnostics --json
          if ($LASTEXITCODE -ne 0 -or -not $securityDiagnostics) { throw 'Security diagnostics falhou.' }
          $startupDiagnostics = & $executable --startup-diagnostics --json
          if ($LASTEXITCODE -ne 0 -or -not $startupDiagnostics) { throw 'Startup diagnostics falhou.' }
          $wixTools = .\scripts\tools\prepare-wix.ps1
          .\installer\build-msi.ps1 `
            -ValidationOnly `
            -WixExecutable $wixTools.WixExecutable `
            -WixExtensionRoot $wixTools.ExtensionRoot
          $leftovers = @(Get-ChildItem -Path . -Recurse -File -Include *.msi,*.partial -ErrorAction SilentlyContinue)
          if ($leftovers.Count -gt 0) { throw 'ValidationOnly deixou artefatos de instalador no workspace.' }
          if (Test-Path -LiteralPath '.\artifacts\installer') { throw 'ValidationOnly criou diretório de distribuição.' }
          $after = git status --short
          if ($before -ne $after) { throw 'ValidationOnly alterou o working tree.' }

      - name: Instalar ferramentas de auditoria fixadas
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-license --locked --version 0.7.0

      - name: Auditar vulnerabilidades Rust
        run: cargo audit --file src-tauri/Cargo.lock --target-os windows --target-arch x86_64 --deny yanked

      - name: Verificar metadados de licença das dependências
        shell: pwsh
        run: |
          $licenses = cargo license --manifest-path src-tauri/Cargo.toml --all-features --json | ConvertFrom-Json
          $metadata = cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1 | ConvertFrom-Json
          $workspaceNames = @($metadata.packages | ForEach-Object { $_.name })
          $missing = @($licenses | Where-Object {
            $workspaceNames -notcontains $_.name -and
            [string]::IsNullOrWhiteSpace($_.license) -and
            [string]::IsNullOrWhiteSpace($_.license_file)
          })
          if ($missing.Count -gt 0) {
            $names = $missing | ForEach-Object { "$($_.name)@$($_.version)" }
            throw "Dependências sem metadado de licença: $($names -join ', ')"
          }
          $licenses | Sort-Object name | Format-Table name, version, license, license_file

# Este workflow valida código-fonte, binário console e MSI sem publicar.
# Ele não assina, não publica e não cria release.
