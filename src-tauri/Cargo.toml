[package]
name = "offline-dental-system"
version = "0.1.0"
description = "Offline Dental System local web server"
authors = ["Offline Dental System contributors"]
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
name = "offline_dental_system_lib"
crate-type = ["rlib"]

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.7", features = ["http1", "json", "tokio"] }
axum-extra = { version = "0.12.2", features = ["cookie"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
mdns-sd = "0.20.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = { version = "0.14.8", features = ["crypto", "pem", "ring"] }
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "4707a1fce4d1bdbc2c4fc7b35266c13e31643cd8", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
socket2 = "0.6.5"
subtle = "2.6.1"
tempfile = "3.23.0"
time = "0.3.54"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "limit", "request-id", "trace"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1.24"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_WindowsProgramming",
] }
windows-service = "0.8.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
